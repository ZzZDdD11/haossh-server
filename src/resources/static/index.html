<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>haossh // debug console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600;700&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="vendor/xterm/xterm.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="scanline"></div>

<header class="topbar">
  <div class="brand">haossh<span class="slash">//</span><span class="sub">ops console</span></div>
  <div class="clock"><span class="val" id="clock">--:--:-- UTC</span></div>
  <div class="conn-id" id="connIdDisplay" style="display:none;">
    <span class="label">session</span><span class="val" id="connIdVal">—</span>
  </div>
  <div class="status-pill">
    <span class="status-dot" id="statusDot"></span>
    <span class="status-text" id="statusText">disconnected</span>
  </div>
  <div class="user-info" id="userInfo" style="display:none;">
    <span class="user-email" id="userEmail">—</span>
    <button class="logout-btn" id="logoutBtn">logout</button>
  </div>
</header>

<main class="app">
  <!-- 左栏：连接管理 -->
  <aside class="panel conn-panel">
    <div class="panel-header">
      <div class="panel-title"><span class="num">01</span>connect</div>
    </div>
    <div class="panel-body">
      <div class="form-group" id="conversationListGroup" style="display:none;">
        <label class="form-label">conversation history</label>
        <div class="conv-list" id="convList"></div>
        <button class="btn" id="newConvBtn" style="margin-top:8px;"><span>+ new conversation</span></button>
      </div>
      <div class="form-group" id="savedConnectionsGroup" style="display:none;">
        <label class="form-label">saved connections</label>
        <select class="form-input" id="savedConnections">
          <option value="">— select saved —</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">host</label>
        <input class="form-input" id="host" placeholder="192.168.1.10" value="">
      </div>
      <div class="form-group">
        <label class="form-label">credentials</label>
        <div class="form-row">
          <input class="form-input" id="username" placeholder="root">
          <input class="form-input" id="port" placeholder="22" value="22">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">password</label>
        <input class="form-input" id="password" type="password" placeholder="••••••••">
      </div>
      <button class="btn" id="connectBtn"><span>↯ establish</span></button>
      <button class="btn danger" id="disconnectBtn" style="margin-top:8px;" disabled><span>▢ terminate</span></button>

      <div class="divider" data-label="session info"></div>
      <div class="info-block" id="sessionInfo">
        <div><span class="k">host:</span> <span class="v" id="info-host">—</span></div>
        <div><span class="k">user:</span> <span class="v" id="info-user">—</span></div>
        <div><span class="k">port:</span> <span class="v" id="info-port">—</span></div>
        <div><span class="k">state:</span> <span class="v" id="info-state">idle</span></div>
      </div>

      <div class="divider" data-label="tools registered"></div>
      <div class="info-block" style="font-size:11px;">
        <div><span class="k">→</span> execute_command</div>
        <div><span class="k">→</span> read_file</div>
        <div><span class="k">→</span> write_file</div>
        <div><span class="k">→</span> list_directory</div>
        <div><span class="k">→</span> get_environment</div>
      </div>
    </div>
  </aside>

  <!-- 右侧：对话 + 终端，上下分层 -->
  <section class="split-panel">
    <div class="panel chat-panel">
      <div class="panel-header">
        <div class="panel-title"><span class="num">02</span>conversation</div>
        <button class="clear-log" id="copyConvBtn" title="复制整段对话">copy all</button>
      </div>
      <div class="messages" id="messages">
      <div class="empty-state" id="emptyState">
        <div class="glyph">&gt;_</div>
        <div class="hint">向运维 Agent 描述你的需求。连接 SSH 后可直接执行命令；未连接时可咨询运维问题。</div>
      </div>
      </div>
      <div class="chat-input-wrap">
        <textarea class="chat-input" id="chatInput" placeholder="描述你的运维需求，例如：看一下磁盘使用情况" rows="1"></textarea>
        <button class="send-btn" id="sendBtn">send</button>
      </div>
    </div>

    <div class="terminal-resize-handle" id="terminalResizeHandle" title="拖动调整终端高度"></div>

    <div class="panel terminal-panel">
      <div class="panel-header">
        <div class="panel-title"><span class="num">03</span>terminal</div>
        <span class="term-status" id="termStatus">not connected</span>
        <button class="clear-log" id="clearTerm">clear</button>
      </div>
      <div class="terminal-body" id="terminalContainer"></div>
    </div>
  </section>
</main>

<div class="toast" id="toast"></div>

<script src="vendor/xterm/xterm.js"></script>
<script src="vendor/xterm/xterm-addon-fit.js"></script>
<script src="app.js"></script>
</body>
</html>
