<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>haossh // login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600;700&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="login-body">
<div class="scanline"></div>

<div class="login-wrap">
  <div class="login-card">
    <div class="brand login-brand">haossh<span class="slash">//</span></div>
    <div class="login-sub">operations console</div>

    <div class="login-tabs">
      <button type="button" class="login-tab active" id="tabLogin">登录</button>
      <button type="button" class="login-tab" id="tabRegister">注册</button>
    </div>

    <form id="loginForm" class="login-form">
      <div class="form-group">
        <label class="form-label">email</label>
        <input class="form-input" id="loginEmail" type="email" placeholder="you@example.com" required autocomplete="username">
      </div>
      <div class="form-group">
        <label class="form-label">password</label>
        <input class="form-input" id="loginPassword" type="password" placeholder="••••••••" required autocomplete="current-password">
      </div>
      <button class="btn" type="submit"><span>↯ sign in</span></button>
    </form>

    <form id="registerForm" class="login-form" style="display:none;">
      <div class="form-group">
        <label class="form-label">organization name</label>
        <input class="form-input" id="regOrgName" placeholder="我的团队" required>
      </div>
      <div class="form-group">
        <label class="form-label">email</label>
        <input class="form-input" id="regEmail" type="email" placeholder="you@example.com" required autocomplete="username">
      </div>
      <div class="form-group">
        <label class="form-label">password</label>
        <input class="form-input" id="regPassword" type="password" placeholder="至少 8 位" minlength="8" required autocomplete="new-password">
      </div>
      <button class="btn" type="submit"><span>+ create account</span></button>
    </form>

    <div class="login-error" id="loginError" style="display:none;"></div>
    <div class="login-foot">secure channel // authorized personnel only</div>
  </div>
</div>

<script src="login.js"></script>
</body>
</html>
