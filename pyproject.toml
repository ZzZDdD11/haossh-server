[project]
name = "haossh-server"
version = "0.1.0"
description = "AI-driven SSH operations platform"
requires-python = ">=3.11"
dependencies = [
    # Web
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    # Config
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "pyyaml>=6.0",
    # SSH
    "asyncssh>=2.18.0",
    "cryptography>=44.0.0",
    # Logging
    "structlog>=24.0.0",
    # Utils
    "httpx>=0.28.0",
    # Phase 3: 数据持久化
    "sqlmodel>=0.0.22",
    "aiosqlite>=0.20.0",
    # Agent
    "python-multipart>=0.0.32",
    "langgraph>=1.2.9",
    "pydantic-ai>=2.13.0",
    "pydantic-evals[logfire]>=2.13.0",
    "greenlet>=3.5.3",
    # Auth: 多租户认证（密码哈希 + JWT）
    "argon2-cffi>=23.1.0",
    "pyjwt>=2.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/haossh"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
